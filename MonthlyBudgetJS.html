<script>

function loadMonthlyBudget(){

    google.script.run
        .withSuccessHandler(showMonthlyBudget)
        .getMonthlyBudget();

}

function showMonthlyBudget(data){

    let html = "";

    let totalBudget = 0;
    let totalActual = 0;
    let totalRemaining = 0;

    data.forEach(function(row){

        let status = "🟢";

        if(row.remaining < 0){

            status = "🔴";

        }else if(row.remaining < row.budget * 0.2){

            status = "🟡";

        }

        totalBudget += Number(row.budget);
        totalActual += Number(row.actual);
        totalRemaining += Number(row.remaining);

        html += `
        <tr>

            <td>${row.group}</td>

            <td>₹${Number(row.budget).toLocaleString("en-IN")}</td>

            <td>₹${Number(row.actual).toLocaleString("en-IN")}</td>

            <td>₹${Number(row.remaining).toLocaleString("en-IN")}</td>

            <td style="font-size:22px;">${status}</td>

        </tr>
        `;

    });

    html += `
    <tr style="background:#f5f7ff;font-weight:bold;">

        <td>Total</td>

        <td>₹${totalBudget.toLocaleString("en-IN")}</td>

        <td>₹${totalActual.toLocaleString("en-IN")}</td>

        <td>₹${totalRemaining.toLocaleString("en-IN")}</td>

        <td></td>

    </tr>
    `;

    document.getElementById("mbTotalBudget").innerHTML =
        "₹" + totalBudget.toLocaleString("en-IN");

    document.getElementById("mbTotalActual").innerHTML =
        "₹" + totalActual.toLocaleString("en-IN");

    document.getElementById("mbTotalRemaining").innerHTML =
        "₹" + totalRemaining.toLocaleString("en-IN");

    document.getElementById("budgetTable").innerHTML = html;

}

</script>
