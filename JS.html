<script>

/* =========================================
   MONEY HUB - FRONTEND
========================================= */


let accounts = [];

let transactions = [];

let categories = [];

let budgets = [];

let filteredTransactions = [];

let editingTransactionId = null;


/* =========================================
   INITIAL LOAD
========================================= */

window.onload = function () {

  showLoading();

  google.script.run

    .withSuccessHandler(function (data) {

      accounts = data.accounts || [];

      transactions = data.transactions || [];

      categories = data.categories || [];

      budgets = data.budgets || [];


      renderTransactions();

      renderAccounts();

      renderCategories();

      renderBudgets();

      prepareForm();

      hideLoading();

    })

    .withFailureHandler(function (error) {

      hideLoading();

      alert(error.message);

    })

    .getInitialData();

};


/* =========================================
   TRANSACTIONS
========================================= */

function renderTransactions() {

  const body =
    document.getElementById(
      "transactionsBody"
    );

  body.innerHTML = "";

  filteredTransactions =
    [...transactions];


  if (filteredTransactions.length === 0) {

    body.innerHTML = `

      <tr>

        <td colspan="9"
            style="text-align:center;padding:30px;color:#64748b">

          No transactions found.

        </td>

      </tr>

    `;

    return;

  }


  filteredTransactions.forEach(function (t) {

    const row =
      document.createElement("tr");


    row.innerHTML = `

      <td>${escapeHtml(t.id)}</td>

      <td>${formatDate(t.date)}</td>

      <td>
        <span class="${getTypeClass(t.type)}">
          ${escapeHtml(t.type)}
        </span>
      </td>

      <td>${escapeHtml(t.category)}</td>

      <td>${escapeHtml(t.fromAccount)}</td>

      <td>${escapeHtml(t.toAccount)}</td>

      <td style="font-weight:600">
        ₹${formatAmount(t.amount)}
      </td>

      <td>${escapeHtml(t.description)}</td>

      <td>

        <div class="actionButtons">

          <button
            class="editButton"
            onclick="editTransaction('${t.id}')">

            Edit

          </button>

          <button
            class="deleteButton"
            onclick="deleteTransaction('${t.id}')">

            Delete

          </button>

        </div>

      </td>

    `;


    body.appendChild(row);

  });

}


/* =========================================
   SEARCH
========================================= */

function filterTransactions() {

  const search =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();


  const clearButton =
    document.getElementById("clearSearch");


  clearButton.style.display =
    search ? "block" : "none";


  if (!search) {

    filteredTransactions =
      [...transactions];

  } else {

    filteredTransactions =
      transactions.filter(function (t) {

        return [

          t.id,

          t.date,

          t.type,

          t.category,

          t.fromAccount,

          t.toAccount,

          t.amount,

          t.description

        ]

          .join(" ")

          .toLowerCase()

          .includes(search);

      });

  }


  renderFilteredTransactions();

}


function renderFilteredTransactions() {

  const body =
    document.getElementById(
      "transactionsBody"
    );

  body.innerHTML = "";


  if (filteredTransactions.length === 0) {

    body.innerHTML = `

      <tr>

        <td colspan="9"
            style="text-align:center;padding:30px;color:#64748b">

          No transactions found.

        </td>

      </tr>

    `;

    return;

  }


  filteredTransactions.forEach(function (t) {

    const row =
      document.createElement("tr");


    row.innerHTML = `

      <td>${escapeHtml(t.id)}</td>

      <td>${formatDate(t.date)}</td>

      <td>
        <span class="${getTypeClass(t.type)}">
          ${escapeHtml(t.type)}
        </span>
      </td>

      <td>${escapeHtml(t.category)}</td>

      <td>${escapeHtml(t.fromAccount)}</td>

      <td>${escapeHtml(t.toAccount)}</td>

      <td style="font-weight:600">
        ₹${formatAmount(t.amount)}
      </td>

      <td>${escapeHtml(t.description)}</td>

      <td>

        <div class="actionButtons">

          <button
            class="editButton"
            onclick="editTransaction('${t.id}')">

            Edit

          </button>

          <button
            class="deleteButton"
            onclick="deleteTransaction('${t.id}')">

            Delete

          </button>

        </div>

      </td>

    `;


    body.appendChild(row);

  });

}


function clearSearch() {

  document.getElementById(
    "searchInput"
  ).value = "";

  filterTransactions();

}


/* =========================================
   OPEN ADD MODAL
========================================= */

function openTransactionModal() {

    "transactionToAccount"

/* =========================================
   CLOSE MODAL
========================================= */

/* =========================================
   PREPARE FORM
========================================= */

function prepareForm() {

  populateAccounts();

  populateCategories();

}


/* =========================================
   ACCOUNT DROPDOWNS
========================================= */

function populateAccounts() {

  const from =
    document.getElementById(
      "transactionFromAccount"
    );

  const to =
    document.getElementById(
      "transactionToAccount"
    );


  const options = `

    <option value="">
      Select Account
    </option>

    ${
      accounts.map(function (a) {

        return `

          <option value="${escapeAttr(a.name)}">

            ${escapeHtml(a.name)}

          </option>

        `;

      }).join("")

    }

  `;


  from.innerHTML = options;

  to.innerHTML = options;

}


/* =========================================
   CATEGORY DROPDOWN
========================================= */

function populateCategories(type) {

  const select =
    document.getElementById(
      "transactionCategory"
    );


  let list = categories;


  if (type) {

    list =
      categories.filter(function (c) {

        return c.type === type;

      });

  }


  select.innerHTML = `

    <option value="">
      Select Category
    </option>

    ${
      list.map(function (c) {

        return `

          <option value="${escapeAttr(c.name)}">

            ${escapeHtml(c.name)}

          </option>

        `;

      }).join("")

    }

  `;

}


/* =========================================
   TYPE CHANGE
========================================= */

function transactionTypeChanged() {

  const type =
    document.getElementById(
      "transactionType"
    ).value;


  const categoryGroup =
    document.getElementById(
      "categoryGroup"
    );

  const fromGroup =
    document.getElementById(
      "fromAccountGroup"
    );

  const toGroup =
    document.getElementById(
      "toAccountGroup"
    );


  categoryGroup.classList.remove(
    "hidden"
  );

  fromGroup.classList.remove(
    "hidden"
  );

  toGroup.classList.remove(
    "hidden"
  );


  populateCategories(type);


  if (type === "Expense") {

    fromGroup.classList.remove(
      "hidden"
    );

    toGroup.classList.add(
      "hidden"
    );

  }


  else if (type === "Income") {

    fromGroup.classList.add(
      "hidden"
    );

    toGroup.classList.remove(
      "hidden"
    );

  }


  else if (type === "Transfer") {

    categoryGroup.classList.add(
      "hidden"
    );

    fromGroup.classList.remove(
      "hidden"
    );

    toGroup.classList.remove(
      "hidden"
    );

  }

}


/* =========================================
   SAVE TRANSACTION
========================================= */

/* =========================================
   SAVE TRANSACTION
========================================= */

function saveTransaction() {

  hideFormError();


  const data = {

    id:
      document.getElementById(
        "transactionId"
      ).value,

    date:
      document.getElementById(
        "transactionDate"
      ).value,

    type:
      document.getElementById(
        "transactionType"
      ).value,

    category:
      document.getElementById(
        "transactionCategory"
      ).value,

    fromAccount:
      document.getElementById(
        "transactionFromAccount"
      ).value,

    toAccount:
      document.getElementById(
        "transactionToAccount"
      ).value,

    amount:
      document.getElementById(
        "transactionAmount"
      ).value,

    description:
      document.getElementById(
        "transactionDescription"
      ).value.trim()

  };


  /* =========================================
     BASIC VALIDATION
  ========================================= */

  if (!data.date) {

    showFormError(
      "Please select a date."
    );

    return;

  }


  if (!data.type) {

    showFormError(
      "Please select transaction type."
    );

    return;

  }


  if (
    !data.amount ||
    Number(data.amount) <= 0
  ) {

    showFormError(
      "Please enter a valid amount."
    );

    return;

  }


  /* =========================================
     EXPENSE VALIDATION
  ========================================= */

  if (data.type === "Expense") {

    if (!data.category) {

      showFormError(
        "Please select a category."
      );

      return;

    }


    if (!data.fromAccount) {

      showFormError(
        "Please select From Account."
      );

      return;

    }


    // Expense should not have To Account
    data.toAccount = "";

  }


  /* =========================================
     INCOME VALIDATION
  ========================================= */

  if (data.type === "Income") {

    if (!data.category) {

      showFormError(
        "Please select a category."
      );

      return;

    }


    if (!data.toAccount) {

      showFormError(
        "Please select To Account."
      );

      return;

    }


    // Income should not have From Account
    data.fromAccount = "";

  }


  /* =========================================
     TRANSFER VALIDATION
  ========================================= */

  if (data.type === "Transfer") {

    if (!data.fromAccount) {

      showFormError(
        "Please select From Account."
      );

      return;

    }


    if (!data.toAccount) {

      showFormError(
        "Please select To Account."
      );

      return;

    }


    if (
      data.fromAccount ===
      data.toAccount
    ) {

      showFormError(
        "From Account and To Account cannot be the same."
      );

      return;

    }


    // Transfer should not have category
    data.category = "";

  }


  /* =========================================
     CATEGORY TYPE VALIDATION
  ========================================= */

  if (
    data.category &&
    data.type !== "Transfer"
  ) {

    const selectedCategory =
      categories.find(function (c) {

        return (
          String(c.name)
            .trim()
            .toLowerCase() ===
          String(data.category)
            .trim()
            .toLowerCase()
        );

      });


    if (!selectedCategory) {

      showFormError(
        "Selected category is not valid."
      );

      return;

    }


    if (
      selectedCategory.type !==
      data.type
    ) {

      showFormError(
        "Category does not match transaction type."
      );

      return;

    }

  }


  /* =========================================
     SAVE
  ========================================= */

  showLoading();


  if (editingTransactionId) {

    google.script.run

      .withSuccessHandler(function () {

        closeTransactionModal();

        reloadData();

      })

      .withFailureHandler(function (error) {

        hideLoading();

        showFormError(
          error.message
        );

      })

      .updateTransaction(data);

  }

  else {

    google.script.run

      .withSuccessHandler(function () {

        closeTransactionModal();

        reloadData();

      })

      .withFailureHandler(function (error) {

        hideLoading();

        showFormError(
          error.message
        );

      })

      .addTransaction(data);

  }

}

/* =========================================
   EDIT
========================================= */

function editTransaction(id) {

  const t =
    transactions.find(function (item) {

      return String(item.id) === String(id);

    });


  if (!t) {

    alert("Transaction not found.");

    return;

  }


  editingTransactionId = id;


  document.getElementById(
    "modalTitle"
  ).textContent = "Edit Transaction";


  document.getElementById(
    "saveButton"
  ).textContent = "Update Transaction";


  document.getElementById(
    "transactionId"
  ).value = t.id;


  document.getElementById(
    "transactionDate"
  ).value = t.date;


  document.getElementById(
    "transactionType"
  ).value = t.type;


  transactionTypeChanged();


  document.getElementById(
    "transactionCategory"
  ).value = t.category;


  document.getElementById(
    "transactionFromAccount"
  ).value = t.fromAccount;


  document.getElementById(
    "transactionToAccount"
  ).value = t.toAccount;


  document.getElementById(
    "transactionAmount"
  ).value = t.amount;


  document.getElementById(
    "transactionDescription"
  ).value = t.description;


  hideFormError();


  document.getElementById(
    "transactionModal"
  ).classList.remove("hidden");

}


/* =========================================
   DELETE
========================================= */

function deleteTransaction(id) {

  const t =
    transactions.find(function (item) {

      return String(item.id) === String(id);

    });


  if (!t) {
    return;
  }


  const confirmed =
    confirm(
      "Delete transaction #" +
      id +
      "?"
    );


  if (!verifyDeletePassword()) {
  return;
}


  showLoading();


  google.script.run

    .withSuccessHandler(function () {

      reloadData();

    })

    .withFailureHandler(function (error) {

      hideLoading();

      alert(error.message);

    })

    .deleteTransaction(id);

}


/* =========================================
   RELOAD DATA
========================================= */

function reloadData() {

      categories = data.categories || [];

      renderBudgets();

      hideLoading();

/* =========================================
   TYPE CLASS
========================================= */

function getTypeClass(type) {

  if (type === "Expense") {
    return "typeExpense";
  }

  if (type === "Income") {
    return "typeIncome";
  }

  if (type === "Transfer") {
    return "typeTransfer";
  }

  return "";

}


/* =========================================
   DATE
========================================= */

function getToday() {

  const now = new Date();

  const year =
    now.getFullYear();

  const month =
    String(
      now.getMonth() + 1
    ).padStart(2, "0");

  const day =
    String(
      now.getDate()
    ).padStart(2, "0");


  return `${year}-${month}-${day}`;

}


function formatDate(date) {

  if (!date) {
    return "";
  }


  const parts =
    String(date).split("-");


  if (parts.length === 3) {

    return (
      parts[2] +
      "-" +
      parts[1] +
      "-" +
      parts[0]
    );

  }


  return date;

}


/* =========================================
   AMOUNT
========================================= */

function formatAmount(amount) {

  return Number(amount || 0)
    .toLocaleString(
      "en-IN",
      {
        maximumFractionDigits: 2
      }
    );

}


/* =========================================
   HTML SECURITY
========================================= */

function escapeHtml(value) {

  if (value === null ||
      value === undefined) {

    return "";

  }


  return String(value)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


function escapeAttr(value) {

  return escapeHtml(value);

}

    "managementError"

  if (mode === "account") {

    document.getElementById(
      "managementModalTitle"
    ).textContent = "Add Account";

    document.getElementById(
      "accountForm"

    document.getElementById(
      "managementModalTitle"
    ).textContent = "Add Category";

    ).textContent = "Add Budget";

    ).classList.remove("hidden");

    clearBudgetForm();

/* =========================================
   EDIT BUDGET
========================================= */

function editBudget(id) {

  const budget =
    budgets.find(function(b) {

      return String(b.id) === String(id);

    });


  if (!budget) {
    return;
  }


  openManagementModal("budget");


  managementEditId = id;


  document.getElementById(
    "managementModalTitle"
  ).textContent = "Edit Budget";


  document.getElementById(
    "managementId"
  ).value = budget.id;


  document.getElementById(
    "budgetCategory"
  ).value = budget.category;


  document.getElementById(
    "budgetAmount"
  ).value = budget.monthlyBudget;


  document.getElementById(
    "budgetRemarks"
  ).value = budget.remarks;

}

/* =========================================
   DUPLICATE CHECK
========================================= */

function isDuplicateName(value, list, field, currentId) {

  const name =
    String(value || "")
      .trim()
      .toLowerCase();

  if (!name) {
    return false;
  }

  return list.some(function (item) {

    // Ignore the current record while editing
    if (
      currentId &&
      String(item.id) === String(currentId)
    ) {
      return false;
    }

    return (
      String(item[field] || "")
        .trim()
        .toLowerCase() === name
    );

  });

}

/* =========================================
   SAVE MANAGEMENT DATA
========================================= */

function saveManagementData() {

  hideManagementError();


  let data;


  if (managementMode === "account") {

    data = {

      id:
        document.getElementById(
          "managementId"
        ).value,

      name:
        document.getElementById(
          "accountName"
        ).value.trim(),

      type:
        document.getElementById(
          "accountType"
        ).value,

      openingBalance:
        document.getElementById(
          "accountOpeningBalance"
        ).value

    };


    if (!data.name) {

      showManagementError(
        "Please enter account name."
      );

      return;

    }

    if (
  isDuplicateName(
    data.name,
    accounts,
    "name",
    managementEditId
  )
) {

  showManagementError(
    "Account already exists."
  );

  return;

}


    showLoading();


    const action =
      managementEditId
        ? "updateAccount"
        : "addAccount";


    google.script.run

      .withSuccessHandler(function() {

        closeManagementModal();

        reloadData();

      })

      .withFailureHandler(function(error) {

        hideLoading();

        showManagementError(
          error.message
        );

      })[action](data);


    return;

  }


  if (managementMode === "category") {

    data = {

      id:
        document.getElementById(
          "managementId"
        ).value,

      name:
        document.getElementById(
          "categoryName"
        ).value.trim(),

      type:
        document.getElementById(
          "categoryType"
        ).value,

      budgetGroup:
        document.getElementById(
          "categoryBudgetGroup"
        ).value.trim()

    };


    if (!data.name) {

      showManagementError(
        "Please enter category name."
      );

      return;

    }

    if (
  isDuplicateName(
    data.name,
    categories,
    "name",
    managementEditId
  )
) {

  showManagementError(
    "Category already exists."
  );

  return;

}


    showLoading();


    const action =
      managementEditId
        ? "updateCategory"
        : "addCategory";


    google.script.run

      .withSuccessHandler(function() {

        closeManagementModal();

        reloadData();

      })

      .withFailureHandler(function(error) {

        hideLoading();

        showManagementError(
          error.message
        );

      })[action](data);


    return;

  }


  if (managementMode === "budget") {

    data = {

      id:
        document.getElementById(
          "managementId"
        ).value,

      category:
        document.getElementById(
          "budgetCategory"
        ).value.trim(),

      monthlyBudget:
        document.getElementById(
          "budgetAmount"
        ).value,

      remarks:
        document.getElementById(
          "budgetRemarks"
        ).value.trim()

    };


    if (!data.category) {

      showManagementError(
        "Please enter budget category."
      );

      return;

    }

    if (
  isDuplicateName(
    data.category,
    budgets,
    "category",
    managementEditId
  )
) {

  showManagementError(
    "Budget already exists."
  );

  return;

}


    showLoading();


    const action =
      managementEditId
        ? "updateBudget"
        : "addBudget";


    google.script.run

      .withSuccessHandler(function() {

        closeManagementModal();

        reloadData();

      })

      .withFailureHandler(function(error) {

        hideLoading();

        showManagementError(
          error.message
        );

      })[action](data);


  }

}

/* =========================================
   DELETE PASSWORD
========================================= */

function verifyDeletePassword() {

  const password =
    prompt("Enter password to delete:");

  if (password === null) {
    return false;
  }

  if (password !== "12345") {

    alert("Incorrect password.");

    return false;

  }

  return true;

}

/* =========================================
   DELETE ACCOUNT
========================================= */

function deleteAccount(id) {

  if (!confirm(
  "Delete this account?"
)) {

  return;

}

if (!verifyDeletePassword()) {

  return;

}


  showLoading();


  google.script.run

    .withSuccessHandler(function() {

      reloadData();

    })

    .withFailureHandler(function(error) {

      hideLoading();

      alert(error.message);

    })

    .deleteAccount(id);

}

/* =========================================
   MANAGEMENT ERROR
========================================= */

function showManagementError(message) {

  const box =
    document.getElementById(
      "managementError"
    );

  box.textContent = message;

  box.classList.remove("hidden");

}


function hideManagementError() {

  document.getElementById(
    "managementError"
  ).classList.add("hidden");

}
