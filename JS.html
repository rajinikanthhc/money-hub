<script>

/* =========================================
   MONEY HUB - FRONTEND
========================================= */


let accounts = [];

let transactions = [];

let categories = [];

let budgets = [];

let filteredTransactions = [];

let editingTransactionId = null;


/* =========================================
   INITIAL LOAD
========================================= */

window.onload = function () {

  showLoading();

  google.script.run

    .withSuccessHandler(function (data) {

      accounts = data.accounts || [];

      transactions = data.transactions || [];

      categories = data.categories || [];

      budgets = data.budgets || [];


      renderTransactions();

updateSummary();

renderAccounts();

      renderCategories();

      renderBudgets();

      initializeDashboard();

      prepareForm();

      hideLoading();

    })

    .withFailureHandler(function (error) {

      hideLoading();

      alert(error.message);

    })

    .getInitialData();

};

/* =========================================
   DASHBOARD
========================================= */

function initializeDashboard() {

  populateDashboardMonths();

  renderDashboard();

  renderDashboardSummary();

}


/* =========================================
   MONTH LIST
========================================= */

function populateDashboardMonths() {

  const chartSelect =
    document.getElementById("chartMonth");

  const summarySelect =
    document.getElementById("summaryMonth");


  chartSelect.innerHTML = "";
  summarySelect.innerHTML = "";


  const months = {};


  transactions.forEach(function (t) {

    if (!t.date) {
      return;
    }


    const parts =
      String(t.date).split("-");


    if (parts.length !== 3) {
      return;
    }


    const key =
      parts[0] + "-" + parts[1];


    months[key] = true;

  });


  const monthKeys =
    Object.keys(months)
      .sort()
      .reverse();


  /* If no transactions exist */

  if (monthKeys.length === 0) {

    const now = new Date();

    const key =
      now.getFullYear() +
      "-" +
      String(now.getMonth() + 1)
        .padStart(2, "0");

    monthKeys.push(key);

  }


  monthKeys.forEach(function (key) {

    const parts =
      key.split("-");

    const year =
      Number(parts[0]);

    const month =
      Number(parts[1]);


    const date =
      new Date(year, month - 1, 1);


    const label =
      date.toLocaleString(
        "en-IN",
        {
          month: "long",
          year: "numeric"
        }
      );


    const option1 =
      document.createElement("option");

    option1.value = key;
    option1.textContent = label;

    chartSelect.appendChild(option1);


    const option2 =
      document.createElement("option");

    option2.value = key;
    option2.textContent = label;

    summarySelect.appendChild(option2);

  });

}


/* =========================================
   DAILY SPENDING CHART
========================================= */

function renderDashboard() {

  const select =
    document.getElementById("chartMonth");


  if (!select) {
    return;
  }


  const selectedMonth =
    select.value;


  const days = {};


  transactions.forEach(function (t) {

    if (t.type !== "Expense") {
      return;
    }


    const parts =
      String(t.date).split("-");


    if (parts.length !== 3) {
      return;
    }


    const key =
      parts[0] + "-" +
      parts[1];


    if (key !== selectedMonth) {
      return;
    }


    const day =
      Number(parts[2]);


    days[day] =
      (days[day] || 0) +
      (Number(t.amount) || 0);

  });


  const container =
    document.getElementById(
      "dailySpendingChart"
    );


  container.innerHTML = "";


  const maxAmount =
    Math.max(
      ...Object.values(days),
      1
    );


  const parts =
    selectedMonth.split("-");


  const year =
    Number(parts[0]);

  const month =
    Number(parts[1]);


  const daysInMonth =
    new Date(
      year,
      month,
      0
    ).getDate();


  for (
    let day = 1;
    day <= daysInMonth;
    day++
  ) {

    const amount =
      days[day] || 0;


    const height =
      amount === 0
        ? 2
        : Math.max(
            5,
            (amount / maxAmount) * 100
          );


    const barWrapper =
      document.createElement("div");

    barWrapper.className =
      "chartBarWrapper";


    barWrapper.innerHTML = `

      <div
        class="chartAmount"
        title="Day ${day}: ₹${formatAmount(amount)}">

        ${amount > 0
          ? "₹" + formatAmount(amount)
          : ""}

      </div>

      <div
        class="chartBar"
        style="height:${height}%"
        title="Day ${day}: ₹${formatAmount(amount)}">
      </div>

      <div class="chartDay">
        ${day}
      </div>

    `;


    container.appendChild(
      barWrapper
    );

  }

}


/* =========================================
   MONTHLY SUMMARY
========================================= */

function renderDashboardSummary() {

  const select =
    document.getElementById(
      "summaryMonth"
    );


  if (!select) {
    return;
  }


  const selectedMonth =
    select.value;


  let income = 0;

  let expense = 0;


  transactions.forEach(function (t) {

    const parts =
      String(t.date).split("-");


    if (parts.length !== 3) {
      return;
    }


    const key =
      parts[0] + "-" +
      parts[1];


    if (key !== selectedMonth) {
      return;
    }


    const amount =
      Number(t.amount) || 0;


    if (t.type === "Income") {

      income += amount;

    }


    if (t.type === "Expense") {

      expense += amount;

    }

  });


  const savings =
    income - expense;


  document.getElementById(
    "dashboardIncome"
  ).textContent =
    "₹" + formatAmount(income);


  document.getElementById(
    "dashboardExpense"
  ).textContent =
    "₹" + formatAmount(expense);


  document.getElementById(
    "dashboardSavings"
  ).textContent =
    "₹" + formatAmount(savings);

}

/* =========================================
   TRANSACTIONS
========================================= */

function renderTransactions() {

  const body =
    document.getElementById(
      "transactionsBody"
    );

  body.innerHTML = "";

  filteredTransactions =
    [...transactions];


  if (filteredTransactions.length === 0) {

    body.innerHTML = `

      <tr>

        <td colspan="9"
            style="text-align:center;padding:30px;color:#64748b">

          No transactions found.

        </td>

      </tr>

    `;

    return;

  }


  filteredTransactions.forEach(function (t) {

    const row =
      document.createElement("tr");


    row.innerHTML = `

      <td>${escapeHtml(t.id)}</td>

      <td>${formatDate(t.date)}</td>

      <td>
        <span class="${getTypeClass(t.type)}">
          ${escapeHtml(t.type)}
        </span>
      </td>

      <td>${escapeHtml(t.category)}</td>

      <td>${escapeHtml(t.fromAccount)}</td>

      <td>${escapeHtml(t.toAccount)}</td>

      <td style="font-weight:600">
        ₹${formatAmount(t.amount)}
      </td>

      <td>${escapeHtml(t.description)}</td>

      <td>

        <div class="actionButtons">

          <button
            class="editButton"
            onclick="editTransaction('${t.id}')">

            Edit

          </button>

          <button
            class="deleteButton"
            onclick="deleteTransaction('${t.id}')">

            Delete

          </button>

        </div>

      </td>

    `;


    body.appendChild(row);

  });

}

/* =========================================
   SUMMARY
========================================= */

function updateSummary() {

  let openingBalance = 0;

  accounts.forEach(function (account) {

    openingBalance +=
      Number(account.openingBalance) || 0;

  });


  let income = 0;

  let expense = 0;


  transactions.forEach(function (transaction) {

    const amount =
      Number(transaction.amount) || 0;


    if (transaction.type === "Income") {

      income += amount;

    }

    else if (transaction.type === "Expense") {

      expense += amount;

    }

  });


  const savings =
    income - expense;


  const totalBalance =
    openingBalance + savings;


  document.getElementById(
    "totalBalance"
  ).textContent =
    "₹" + formatAmount(totalBalance);


  document.getElementById(
    "totalIncome"
  ).textContent =
    "₹" + formatAmount(income);


  document.getElementById(
    "totalExpense"
  ).textContent =
    "₹" + formatAmount(expense);


  document.getElementById(
    "totalSavings"
  ).textContent =
    "₹" + formatAmount(savings);

}


/* =========================================
   SEARCH
========================================= */

function filterTransactions() {

  const search =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();


  const clearButton =
    document.getElementById("clearSearch");


  clearButton.style.display =
    search ? "block" : "none";


  if (!search) {

    filteredTransactions =
      [...transactions];

  } else {

    filteredTransactions =
      transactions.filter(function (t) {

        return [

          t.id,

          t.date,

          t.type,

          t.category,

          t.fromAccount,

          t.toAccount,

          t.amount,

          t.description

        ]

          .join(" ")

          .toLowerCase()

          .includes(search);

      });

  }


  renderFilteredTransactions();

}


function renderFilteredTransactions() {

  const body =
    document.getElementById(
      "transactionsBody"
    );

  body.innerHTML = "";


  if (filteredTransactions.length === 0) {

    body.innerHTML = `

      <tr>

        <td colspan="9"
            style="text-align:center;padding:30px;color:#64748b">

          No transactions found.

        </td>

      </tr>

    `;

    return;

  }


  filteredTransactions.forEach(function (t) {

    const row =
      document.createElement("tr");


    row.innerHTML = `

      <td>${escapeHtml(t.id)}</td>

      <td>${formatDate(t.date)}</td>

      <td>
        <span class="${getTypeClass(t.type)}">
          ${escapeHtml(t.type)}
        </span>
      </td>

      <td>${escapeHtml(t.category)}</td>

      <td>${escapeHtml(t.fromAccount)}</td>

      <td>${escapeHtml(t.toAccount)}</td>

      <td style="font-weight:600">
        ₹${formatAmount(t.amount)}
      </td>

      <td>${escapeHtml(t.description)}</td>

      <td>

        <div class="actionButtons">

          <button
            class="editButton"
            onclick="editTransaction('${t.id}')">

            Edit

          </button>

          <button
            class="deleteButton"
            onclick="deleteTransaction('${t.id}')">

            Delete

          </button>

        </div>

      </td>

    `;


    body.appendChild(row);

  });

}


function clearSearch() {

  document.getElementById(
    "searchInput"
  ).value = "";

  filterTransactions();

}


/* =========================================
   OPEN ADD MODAL
========================================= */

function openTransactionModal() {

  editingTransactionId = null;

  document.getElementById(
    "modalTitle"
  ).textContent = "Add Transaction";


  document.getElementById(
    "saveButton"
  ).textContent = "Save Transaction";


  document.getElementById(
    "transactionId"
  ).value = "";


  prepareForm();


  document.getElementById(
    "transactionDate"
  ).value = getToday();


  document.getElementById(
    "transactionType"
  ).value = "";


  document.getElementById(
    "transactionCategory"
  ).value = "";


  document.getElementById(
    "transactionFromAccount"
  ).value = "";


  document.getElementById(
    "transactionToAccount"
  ).value = "";


  document.getElementById(
    "transactionAmount"
  ).value = "";


  document.getElementById(
    "transactionDescription"
  ).value = "";


  hideFormError();


  document.getElementById(
    "transactionModal"
  ).classList.remove("hidden");

}


/* =========================================
   CLOSE MODAL
========================================= */

function closeTransactionModal() {

  document.getElementById(
    "transactionModal"
  ).classList.add("hidden");

}


/* =========================================
   PREPARE FORM
========================================= */

function prepareForm() {

  populateAccounts();

  populateCategories();

  transactionTypeChanged();

}


/* =========================================
   ACCOUNT DROPDOWNS
========================================= */

function populateAccounts() {

  const from =
    document.getElementById(
      "transactionFromAccount"
    );

  const to =
    document.getElementById(
      "transactionToAccount"
    );


  const options = `

    <option value="">
      Select Account
    </option>

    ${
      accounts.map(function (a) {

        return `

          <option value="${escapeAttr(a.name)}">

            ${escapeHtml(a.name)}

          </option>

        `;

      }).join("")

    }

  `;


  from.innerHTML = options;

  to.innerHTML = options;

}


/* =========================================
   CATEGORY DROPDOWN
========================================= */

function populateCategories(type) {

  const select =
    document.getElementById(
      "transactionCategory"
    );


  let list = categories;


  if (type) {

    list =
      categories.filter(function (c) {

        return c.type === type;

      });

  }


  select.innerHTML = `

    <option value="">
      Select Category
    </option>

    ${
      list.map(function (c) {

        return `

          <option value="${escapeAttr(c.name)}">

            ${escapeHtml(c.name)}

          </option>

        `;

      }).join("")

    }

  `;

}


/* =========================================
   TYPE CHANGE
========================================= */

function transactionTypeChanged() {

  const type =
    document.getElementById(
      "transactionType"
    ).value;


  const categoryGroup =
    document.getElementById(
      "categoryGroup"
    );

  const fromGroup =
    document.getElementById(
      "fromAccountGroup"
    );

  const toGroup =
    document.getElementById(
      "toAccountGroup"
    );


  categoryGroup.classList.remove(
    "hidden"
  );

  fromGroup.classList.remove(
    "hidden"
  );

  toGroup.classList.remove(
    "hidden"
  );


  populateCategories(type);


  if (type === "Expense") {

    fromGroup.classList.remove(
      "hidden"
    );

    toGroup.classList.add(
      "hidden"
    );

  }


  else if (type === "Income") {

    fromGroup.classList.add(
      "hidden"
    );

    toGroup.classList.remove(
      "hidden"
    );

  }


  else if (type === "Transfer") {

    categoryGroup.classList.add(
      "hidden"
    );

    fromGroup.classList.remove(
      "hidden"
    );

    toGroup.classList.remove(
      "hidden"
    );

  }

}


/* =========================================
   SAVE TRANSACTION
========================================= */

/* =========================================
   SAVE TRANSACTION
========================================= */

function saveTransaction() {

  hideFormError();


  const data = {

    id:
      document.getElementById(
        "transactionId"
      ).value,

    date:
      document.getElementById(
        "transactionDate"
      ).value,

    type:
      document.getElementById(
        "transactionType"
      ).value,

    category:
      document.getElementById(
        "transactionCategory"
      ).value,

    fromAccount:
      document.getElementById(
        "transactionFromAccount"
      ).value,

    toAccount:
      document.getElementById(
        "transactionToAccount"
      ).value,

    amount:
      document.getElementById(
        "transactionAmount"
      ).value,

    description:
      document.getElementById(
        "transactionDescription"
      ).value.trim()

  };


  /* =========================================
     BASIC VALIDATION
  ========================================= */

  if (!data.date) {

    showFormError(
      "Please select a date."
    );

    return;

  }


  if (!data.type) {

    showFormError(
      "Please select transaction type."
    );

    return;

  }


  if (
    !data.amount ||
    Number(data.amount) <= 0
  ) {

    showFormError(
      "Please enter a valid amount."
    );

    return;

  }


  /* =========================================
     EXPENSE VALIDATION
  ========================================= */

  if (data.type === "Expense") {

    if (!data.category) {

      showFormError(
        "Please select a category."
      );

      return;

    }


    if (!data.fromAccount) {

      showFormError(
        "Please select From Account."
      );

      return;

    }


    // Expense should not have To Account
    data.toAccount = "";

  }


  /* =========================================
     INCOME VALIDATION
  ========================================= */

  if (data.type === "Income") {

    if (!data.category) {

      showFormError(
        "Please select a category."
      );

      return;

    }


    if (!data.toAccount) {

      showFormError(
        "Please select To Account."
      );

      return;

    }


    // Income should not have From Account
    data.fromAccount = "";

  }


  /* =========================================
     TRANSFER VALIDATION
  ========================================= */

  if (data.type === "Transfer") {

    if (!data.fromAccount) {

      showFormError(
        "Please select From Account."
      );

      return;

    }


    if (!data.toAccount) {

      showFormError(
        "Please select To Account."
      );

      return;

    }


    if (
      data.fromAccount ===
      data.toAccount
    ) {

      showFormError(
        "From Account and To Account cannot be the same."
      );

      return;

    }


    // Transfer should not have category
    data.category = "";

  }


  /* =========================================
     CATEGORY TYPE VALIDATION
  ========================================= */

  if (
    data.category &&
    data.type !== "Transfer"
  ) {

    const selectedCategory =
      categories.find(function (c) {

        return (
          String(c.name)
            .trim()
            .toLowerCase() ===
          String(data.category)
            .trim()
            .toLowerCase()
        );

      });


    if (!selectedCategory) {

      showFormError(
        "Selected category is not valid."
      );

      return;

    }


    if (
      selectedCategory.type !==
      data.type
    ) {

      showFormError(
        "Category does not match transaction type."
      );

      return;

    }

  }


  /* =========================================
     SAVE
  ========================================= */

  showLoading();


  if (editingTransactionId) {

    google.script.run

      .withSuccessHandler(function () {

        closeTransactionModal();

        reloadData();

      })

      .withFailureHandler(function (error) {

        hideLoading();

        showFormError(
          error.message
        );

      })

      .updateTransaction(data);

  }

  else {

    google.script.run

      .withSuccessHandler(function () {

        closeTransactionModal();

        reloadData();

      })

      .withFailureHandler(function (error) {

        hideLoading();

        showFormError(
          error.message
        );

      })

      .addTransaction(data);

  }

}

/* =========================================
   EDIT
========================================= */

function editTransaction(id) {

  const t =
    transactions.find(function (item) {

      return String(item.id) === String(id);

    });


  if (!t) {

    alert("Transaction not found.");

    return;

  }


  editingTransactionId = id;


  document.getElementById(
    "modalTitle"
  ).textContent = "Edit Transaction";


  document.getElementById(
    "saveButton"
  ).textContent = "Update Transaction";


  document.getElementById(
    "transactionId"
  ).value = t.id;


  document.getElementById(
    "transactionDate"
  ).value = t.date;


  document.getElementById(
    "transactionType"
  ).value = t.type;


  transactionTypeChanged();


  document.getElementById(
    "transactionCategory"
  ).value = t.category;


  document.getElementById(
    "transactionFromAccount"
  ).value = t.fromAccount;


  document.getElementById(
    "transactionToAccount"
  ).value = t.toAccount;


  document.getElementById(
    "transactionAmount"
  ).value = t.amount;


  document.getElementById(
    "transactionDescription"
  ).value = t.description;


  hideFormError();


  document.getElementById(
    "transactionModal"
  ).classList.remove("hidden");

}


/* =========================================
   DELETE
========================================= */

function deleteTransaction(id) {

  const t =
    transactions.find(function (item) {

      return String(item.id) === String(id);

    });


  if (!t) {
    return;
  }


  const confirmed =
    confirm(
      "Delete transaction #" +
      id +
      "?"
    );


  if (!verifyDeletePassword()) {
  return;
}


  showLoading();


  google.script.run

    .withSuccessHandler(function () {

      reloadData();

    })

    .withFailureHandler(function (error) {

      hideLoading();

      alert(error.message);

    })

    .deleteTransaction(id);

}


/* =========================================
   RELOAD DATA
========================================= */

function reloadData() {

  google.script.run

    .withSuccessHandler(function (data) {

      accounts = data.accounts || [];

      transactions = data.transactions || [];

      categories = data.categories || [];

      budgets = data.budgets || [];


      renderTransactions();

updateSummary();

renderAccounts();

renderCategories();

renderBudgets();

      hideLoading();

    })

    .withFailureHandler(function (error) {

      hideLoading();

      alert(error.message);

    })

    .getInitialData();

}


/* =========================================
   ACCOUNTS PAGE
========================================= */

function renderAccounts() {

  const body =
    document.getElementById("accountsBody");

  const footer =
    document.getElementById("accountsFooter");

  body.innerHTML = "";
  footer.innerHTML = "";


  let totalOpeningBalance = 0;
  let totalCurrentBalance = 0;


  accounts.forEach(function (a) {

    const openingBalance =
      Number(a.openingBalance) || 0;


    /* =====================================
       CURRENT BALANCE
    ===================================== */

    let currentBalance =
      openingBalance;


    transactions.forEach(function (t) {

      const amount =
        Number(t.amount) || 0;


      /* Income received into this account */

      if (
        t.type === "Income" &&
        String(t.toAccount) === String(a.name)
      ) {

        currentBalance += amount;

      }


      /* Expense paid from this account */

      if (
        t.type === "Expense" &&
        String(t.fromAccount) === String(a.name)
      ) {

        currentBalance -= amount;

      }


      /* Transfer received */

      if (
        t.type === "Transfer" &&
        String(t.toAccount) === String(a.name)
      ) {

        currentBalance += amount;

      }


      /* Transfer sent */

      if (
        t.type === "Transfer" &&
        String(t.fromAccount) === String(a.name)
      ) {

        currentBalance -= amount;

      }

    });


    totalOpeningBalance +=
      openingBalance;

    totalCurrentBalance +=
      currentBalance;


    body.innerHTML += `

      <tr>

        <td>
          ${escapeHtml(a.id)}
        </td>

        <td>
          ${escapeHtml(a.name)}
        </td>

        <td>
          ${escapeHtml(a.type)}
        </td>

        <td>
          ₹${formatAmount(openingBalance)}
        </td>

        <td style="font-weight:600">
          ₹${formatAmount(currentBalance)}
        </td>

        <td>

          <div class="actionButtons">

            <button
              class="editButton"
              onclick="editAccount('${a.id}')">

              Edit

            </button>

            <button
              class="deleteButton"
              onclick="deleteAccount('${a.id}')">

              Delete

            </button>

          </div>

        </td>

      </tr>

    `;

  });


  /* =====================================
     TOTAL ROW
  ===================================== */

  footer.innerHTML = `

    <tr>

      <td colspan="3"></td>
      
     <td style="font-weight:700; font-size:18px">

  ₹${formatAmount(totalOpeningBalance)}

</td>

<td style="font-weight:700; font-size:18px">

  ₹${formatAmount(totalCurrentBalance)}

</td>
      <td></td>

    </tr>

  `;

}

/* =========================================
   CATEGORIES PAGE
========================================= */

/* =========================================
   CATEGORIES PAGE
========================================= */

/* =========================================
   CATEGORIES PAGE
========================================= */

function renderCategories() {

  const body =
    document.getElementById("categoriesBody");

  body.innerHTML = "";


  /* =====================================
     CURRENT MONTH
  ====================================== */

  const today = new Date();

  const currentMonth = today.getMonth();
  const currentYear = today.getFullYear();


  /* =====================================
     CATEGORY ROWS
  ====================================== */

  categories.forEach(function (c) {

    let categoryTotal = 0;


    transactions.forEach(function (t) {

      /* Match transaction type with
         category type */

      if (
        String(t.type).trim().toLowerCase() !==
        String(c.type).trim().toLowerCase()
      ) {
        return;
      }


      /* Match category */

      if (
        String(t.category).trim().toLowerCase() !==
        String(c.name).trim().toLowerCase()
      ) {
        return;
      }


      /* Check current month */

      const transactionDate =
        new Date(t.date);

      if (
        isNaN(transactionDate.getTime())
      ) {
        return;
      }


      if (
        transactionDate.getMonth() === currentMonth &&
        transactionDate.getFullYear() === currentYear
      ) {

        categoryTotal +=
          Number(t.amount) || 0;

      }

    });


    /* =================================
       ADD ROW
    ================================= */

    body.innerHTML += `

      <tr>

        <td>
          ${escapeHtml(c.id)}
        </td>

        <td>
          ${escapeHtml(c.name)}
        </td>

        <td>
          ${escapeHtml(c.type)}
        </td>

        <td>
          ${escapeHtml(c.budgetGroup)}
        </td>

        <td style="font-weight:600">
          ₹${formatAmount(categoryTotal)}
        </td>

        <td>

          <div class="actionButtons">

            <button
              class="editButton"
              onclick="editCategory('${c.id}')">

              Edit

            </button>

            <button
              class="deleteButton"
              onclick="deleteCategory('${c.id}')">

              Delete

            </button>

          </div>

        </td>

      </tr>

    `;

  });

}

/* =========================================
   BUDGET PAGE
========================================= */

function renderBudgets() {

  const body =
    document.getElementById("budgetBody");

  const footer =
    document.getElementById("budgetFooter");

  body.innerHTML = "";
  footer.innerHTML = "";


  let totalBudget = 0;
  let totalUtilised = 0;
  let totalRemaining = 0;


  budgets.forEach(function (b) {

    const monthlyBudget =
      Number(b.monthlyBudget) || 0;


    /* =====================================
       CALCULATE UTILISED
       Based on Expense transactions
       matching the Budget Group
    ===================================== */

    let utilised = 0;


    transactions.forEach(function (t) {

      if (t.type !== "Expense") {
        return;
      }


      const category =
        categories.find(function (c) {

          return String(c.name).trim().toLowerCase() ===
                 String(t.category).trim().toLowerCase();

        });


      if (!category) {
        return;
      }


      if (
        String(category.budgetGroup)
          .trim()
          .toLowerCase() ===
        String(b.category)
          .trim()
          .toLowerCase()
      ) {

        utilised +=
          Number(t.amount) || 0;

      }

    });


    const remaining =
      monthlyBudget - utilised;


    totalBudget += monthlyBudget;
    totalUtilised += utilised;
    totalRemaining += remaining;


    body.innerHTML += `

      <tr>

        <td>
          ${escapeHtml(b.id)}
        </td>

        <td>
          ${escapeHtml(b.category)}
        </td>

        <td>
          ₹${formatAmount(monthlyBudget)}
        </td>

        <td class="budgetUtilised">
          ₹${formatAmount(utilised)}
        </td>

        <td class="${
          remaining < 0
            ? "budgetRemainingOver"
            : "budgetRemaining"
        }">
          ₹${formatAmount(remaining)}
        </td>

        <td>
          ${escapeHtml(b.remarks)}
        </td>

        <td>

          <div class="actionButtons">

            <button
              class="editButton"
              onclick="editBudget('${b.id}')">

              Edit

            </button>

            <button
              class="deleteButton"
              onclick="deleteBudget('${b.id}')">

              Delete

            </button>

          </div>

        </td>

      </tr>

    `;

  });


  /* =====================================
     TOTAL ROW
  ===================================== */

  footer.innerHTML = `

    <tr class="budgetTotalRow">

      <td></td>

      <td></td>

      <td>
        ₹${formatAmount(totalBudget)}
      </td>

      <td class="budgetUtilised totalNumber">
        ₹${formatAmount(totalUtilised)}
      </td>

      <td class="budgetRemaining totalNumber">
        ₹${formatAmount(totalRemaining)}
      </td>

      <td></td>

      <td></td>

    </tr>

  `;

}

/* =========================================

========================================= */

function getTypeClass(type) {

  if (type === "Expense") {
    return "typeExpense";
  }

  if (type === "Income") {
    return "typeIncome";
  }

  if (type === "Transfer") {
    return "typeTransfer";
  }

  return "";

}


/* =========================================
   DATE
========================================= */

function getToday() {

  const now = new Date();

  const year =
    now.getFullYear();

  const month =
    String(
      now.getMonth() + 1
    ).padStart(2, "0");

  const day =
    String(
      now.getDate()
    ).padStart(2, "0");


  return `${year}-${month}-${day}`;

}


function formatDate(date) {

  if (!date) {
    return "";
  }


  const parts =
    String(date).split("-");


  if (parts.length === 3) {

    return (
      parts[2] +
      "-" +
      parts[1] +
      "-" +
      parts[0]
    );

  }


  return date;

}


/* =========================================
   AMOUNT
========================================= */

function formatAmount(amount) {

  return Number(amount || 0)
    .toLocaleString(
      "en-IN",
      {
        maximumFractionDigits: 2
      }
    );

}


/* =========================================
   HTML SECURITY
========================================= */

function escapeHtml(value) {

  if (value === null ||
      value === undefined) {

    return "";

  }


  return String(value)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


function escapeAttr(value) {

  return escapeHtml(value);

}

/* =========================================
   DUPLICATE CHECK
========================================= */

function isDuplicateName(value, list, field, currentId) {

  const name =
    String(value || "")
      .trim()
      .toLowerCase();

  if (!name) {
    return false;
  }

  return list.some(function (item) {

    // Ignore the current record while editing
    if (
      currentId &&
      String(item.id) === String(currentId)
    ) {
      return false;
    }

    return (
      String(item[field] || "")
        .trim()
        .toLowerCase() === name
    );

  });

}

) {

    showLoading();
