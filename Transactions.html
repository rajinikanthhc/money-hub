<br>

<button onclick="openTransactionForm()">
➕ Add Transaction
</button>

<input
type="text"
id="searchTransaction"
placeholder="Search..."
onkeyup="searchTransactions()">

<br><br>

<table class="table">

<thead>

<tr>

<th>ID</th>
<th>Date</th>
<th>Type</th>
<th>Category</th>
<th>From Account</th>
<th>To Account</th>
<th>Amount</th>
<th>Payment</th>
<th>Description</th>
<th>Action</th>

</tr>

</thead>

<tbody id="transactionTable">

</tbody>

</table>

<!-- Transaction Popup -->

<div id="transactionModal" class="modal" style="display:none;">

<div class="modal-content">

<h2>Add Transaction</h2>

<label>Date</label>
<input type="date" id="tDate">

<label>Type</label>

<select id="tType" onchange="changeTransactionType()">

    <option value="Income">Income</option>
    <option value="Expense">Expense</option>
    <option value="Transfer">Transfer</option>

</select>

<div id="categoryDiv">

<label>Category</label>

<select id="tCategory"></select>

</div>

<div id="fromAccountDiv">

<label>From Account</label>

<select id="tFromAccount"></select>

</div>

<div id="toAccountDiv" style="display:none;">

<label>To Account</label>

<select id="tToAccount"></select>

</div>

<label>Amount</label>
<input type="number" id="tAmount">

<div id="paymentDiv">

    <label>Payment Mode</label>

    <select id="tPayment">

        <option>Cash</option>
        <option>UPI</option>
        <option>Bank Transfer</option>
        <option>Credit Card</option>

    </select>

</div>

<label>Description</label>
<input type="text" id="tDescription">

<br><br>

<button onclick="saveTransaction()">
Save
</button>

<button onclick="closeTransactionForm()">
Cancel
</button>

</div>

</div>

<style>

.table{

width:100%;

border-collapse:collapse;

}

.table th{

background:#2563eb;

color:white;

padding:12px;

text-align:left;

}

.table td{

padding:10px;

border-bottom:1px solid #ddd;

}

button{

padding:8px 15px;

cursor:pointer;

}

.modal{

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:rgba(0,0,0,.35);

display:flex;

justify-content:center;

align-items:center;

}

.modal-content{

background:#fff;

width:420px;

padding:25px;

border-radius:10px;

box-shadow:0 2px 10px rgba(0,0,0,.2);

}

.modal-content input,
.modal-content select{

width:100%;

padding:8px;

margin-top:5px;

margin-bottom:12px;

box-sizing:border-box;

}

</style>
