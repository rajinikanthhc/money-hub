<script>

let accounts = [];
let editAccountRow = 0;

function loadAccounts(){

    google.script.run
        .withSuccessHandler(function(data){

            accounts = data;
            showAccounts(data);

        })
        .getAllAccounts();

}

function showAccounts(data){

    let html = "";

    let totalCurrentBalance = 0;

    for(let i=0;i<data.length;i++){

        totalCurrentBalance += Number(data[i][4]);

        html += `

        <tr>

            <td>${data[i][0]}</td>

            <td>${data[i][1]}</td>

            <td>${data[i][2]}</td>

            <td>₹${Math.round(Number(data[i][3])).toLocaleString("en-IN")}</td>

            <td>₹${Math.round(Number(data[i][4])).toLocaleString("en-IN")}</td>

            <td>

                <button onclick="editAccount(${i})">✏️</button>

                <button onclick="deleteAccount(${i})">🗑️</button>

            </td>

        </tr>

        `;

    }

    document.getElementById("accountTable").innerHTML = html;

    document.getElementById("totalCurrentBalance").innerHTML =
        "₹" + Math.round(totalCurrentBalance).toLocaleString("en-IN");

}

function searchAccounts(){

    const keyword = document
        .getElementById("searchAccount")
        .value
        .toLowerCase();

    let filtered = [];

    filtered.push(accounts[0]);

    for(let i=1;i<accounts.length;i++){

        if(accounts[i].join(" ").toLowerCase().includes(keyword)){

            filtered.push(accounts[i]);

        }

    }

    showAccounts(filtered);

}

function openAccountForm(){

    editAccountRow = 0;

    clearAccountForm();

    document.getElementById("accountModal").style.display = "flex";

}

function closeAccountForm(){

    document.getElementById("accountModal").style.display = "none";

}

function clearAccountForm(){

    document.getElementById("aName").value = "";
    document.getElementById("aType").value = "Bank";
    document.getElementById("aBalance").value = "";

}

function saveAccount(){

    const data = {

        account : document.getElementById("aName").value,
        type : document.getElementById("aType").value,
        balance : document.getElementById("aBalance").value

    };

    const runner = google.script.run
        .withSuccessHandler(function(){

            editAccountRow = 0;

            closeAccountForm();

            clearAccountForm();

            loadAccounts();

        });

    if(editAccountRow == 0){

        runner.saveAccount(data);

    }else{

        data.row = editAccountRow;

        runner.updateAccount(data);

    }

}

function editAccount(row){

    editAccountRow = row;

    document.getElementById("aName").value = accounts[row][1];
    document.getElementById("aType").value = accounts[row][2];
    document.getElementById("aBalance").value = accounts[row][3];

    document.getElementById("accountModal").style.display = "flex";

}

function deleteAccount(row){

    if(!confirm("Delete this account?")) return;

    google.script.run
        .withSuccessHandler(loadAccounts)
        .deleteAccount(row);

}

</script>
