<style>

/* =========================================
   RESET
========================================= */

* {

  box-sizing: border-box;

}


body {

  margin: 0;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background: #f4f6fa;

  color: #172554;

}


/* =========================================
   APP
========================================= */

.app {

  min-height: 100vh;

}


/* =========================================
   TOP BAR
========================================= */

.topbar {

  height: 74px;

  background: #ffffff;

  border-bottom: 1px solid #d8dee9;

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 0 24px;

}


.brand {

  display: flex;

  align-items: center;

  gap: 10px;

  font-size: 24px;

  font-weight: 700;

  color: #164194;

}


.brandIcon {

  font-size: 25px;

}


.headerActions {

  display: flex;

  align-items: center;

  gap: 10px;

}


/* =========================================
   BUTTONS
========================================= */

button {

  font-family: inherit;

  cursor: pointer;

}


.primaryButton {

  border: none;

  background: #2864e8;

  color: white;

  padding: 11px 18px;

  border-radius: 5px;

  font-size: 14px;

  font-weight: 500;

}


.primaryButton:hover {

  background: #1f55ca;

}


.navButton {

  background: white;

  color: #172554;

  border: 1px solid #cbd5e1;

  padding: 11px 17px;

  border-radius: 5px;

  font-size: 14px;

}


.navButton:hover {

  background: #f8fafc;

}


/* =========================================
   MAIN
========================================= */

main {

  padding: 28px 20px;

}


.pageHeader {

  display: flex;

  justify-content: space-between;

  align-items: center;

  margin-bottom: 18px;

}


.pageHeader h1 {

  margin: 0;

  font-size: 28px;

  color: #163b83;

}


/* =========================================
   SEARCH
========================================= */

.searchWrapper {

  position: relative;

}


.searchWrapper input {

  width: 280px;

  height: 38px;

  padding: 0 38px 0 13px;

  border: 1px solid #cbd5e1;

  border-radius: 5px;

  outline: none;

  font-size: 14px;

  background: white;

}


.searchWrapper input:focus {

  border-color: #2864e8;

}


#clearSearch {

  position: absolute;

  right: 6px;

  top: 5px;

  width: 28px;

  height: 28px;

  border: none;

  background: transparent;

  font-size: 22px;

  color: #64748b;

  display: none;

}


/* =========================================
   TABLE
========================================= */

.tableContainer {

  width: 100%;

  overflow-x: auto;

  background: white;

  border-radius: 7px;

}


table {

  width: 100%;

  border-collapse: separate;

  border-spacing: 0;

  font-size: 14px;

}


thead th {

  background: #2864e8;

  color: white;

  padding: 13px 12px;

  text-align: left;

  white-space: nowrap;

  font-weight: 600;

}


thead th:first-child {

  border-top-left-radius: 7px;

}


thead th:last-child {

  border-top-right-radius: 7px;

}


tbody td {

  padding: 12px;

  border-bottom: 1px solid #e5e7eb;

  color: #334155;

  white-space: nowrap;

}


tbody tr:hover {

  background: #f8fafc;

}


/* =========================================
   TRANSACTION TYPE
========================================= */

.typeExpense {

  color: #dc2626;

  font-weight: 600;

}


.typeIncome {

  color: #15803d;

  font-weight: 600;

}


.typeTransfer {

  color: #2563eb;

  font-weight: 600;

}


/* =========================================
   ACTION
========================================= */

.actionButtons {

  display: flex;

  gap: 6px;

}


.editButton {

  border: 1px solid #cbd5e1;

  background: white;

  color: #2563eb;

  border-radius: 4px;

  padding: 5px 9px;

}


.deleteButton {

  border: 1px solid #fecaca;

  background: white;

  color: #dc2626;

  border-radius: 4px;

  padding: 5px 9px;

}


/* =========================================
   MODAL
========================================= */

.modalOverlay {

  position: fixed;

  inset: 0;

  background: rgba(15, 23, 42, 0.45);

  display: flex;

  align-items: center;

  justify-content: center;

  z-index: 1000;

}


.modal {

  width: 560px;

  max-width: calc(100% - 30px);

  background: white;

  border-radius: 8px;

  box-shadow:
    0 20px 50px rgba(0,0,0,.2);

}


.modalHeader {

  padding: 18px 22px;

  border-bottom: 1px solid #e5e7eb;

  display: flex;

  align-items: center;

  justify-content: space-between;

}


.modalHeader h2 {

  margin: 0;

  font-size: 20px;

  color: #163b83;

}


.closeButton {

  border: none;

  background: transparent;

  font-size: 27px;

  color: #64748b;

}


.modalBody {

  padding: 22px;

}


.formGrid {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 16px;

}


.formGroup {

  display: flex;

  flex-direction: column;

  gap: 6px;

}


.fullWidth {

  grid-column: 1 / -1;

}


.formGroup label {

  font-size: 13px;

  font-weight: 600;

  color: #334155;

}


.formGroup input,
.formGroup select {

  height: 40px;

  border: 1px solid #cbd5e1;

  border-radius: 5px;

  padding: 0 10px;

  font-size: 14px;

  outline: none;

  background: white;

}


.formGroup input:focus,
.formGroup select:focus {

  border-color: #2864e8;

}


/* =========================================
   MODAL FOOTER
========================================= */

.modalFooter {

  padding: 15px 22px;

  border-top: 1px solid #e5e7eb;

  display: flex;

  justify-content: flex-end;

  gap: 10px;

}


.cancelButton {

  border: 1px solid #cbd5e1;

  background: white;

  color: #334155;

  padding: 10px 17px;

  border-radius: 5px;

}


/* =========================================
   ERROR
========================================= */

.formError {

  margin-top: 16px;

  background: #fef2f2;

  color: #b91c1c;

  border: 1px solid #fecaca;

  padding: 10px;

  border-radius: 5px;

  font-size: 13px;

}


/* =========================================
   LOADING
========================================= */

.loadingOverlay {

  position: fixed;

  inset: 0;

  background: rgba(255,255,255,.65);

  display: flex;

  align-items: center;

  justify-content: center;

  z-index: 2000;

}


.spinner {

  width: 35px;

  height: 35px;

  border: 4px solid #dbeafe;

  border-top-color: #2864e8;

  border-radius: 50%;

  animation: spin .8s linear infinite;

}


@keyframes spin {

  to {
    transform: rotate(360deg);
  }

}


/* =========================================
   HIDDEN
========================================= */

.hidden {

  display: none !important;

}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 800px) {

  .topbar {

    height: auto;

    padding: 15px;

    flex-direction: column;

    align-items: stretch;

    gap: 15px;

  }


  .headerActions {

    flex-wrap: wrap;

  }


  .pageHeader {

    flex-direction: column;

    align-items: stretch;

    gap: 15px;

  }


  .searchWrapper input {

    width: 100%;

  }


  .formGrid {

    grid-template-columns: 1fr;

  }


  .fullWidth {

    grid-column: auto;

  }

}

.managementForm {

  display: flex;

  flex-direction: column;

  gap: 16px;

}

/* =========================================
   TRANSACTION SUMMARY
========================================= */

.transactionHeader {
  display: flex;
  align-items: center;
  gap: 20px;
}

.summaryCards {
  display: flex;
  gap: 10px;
  margin-left: auto;
}

.summaryCard {
  min-width: 125px;
  padding: 8px 14px;
  background: #ffffff;
  border: 1px solid #d7deea;
  border-radius: 6px;
  text-align: center;
}

.summaryTitle {
  font-size: 12px;
  color: #64748b;
  margin-bottom: 2px;
}

.summaryValue {
  font-size: 16px;
  font-weight: 700;
  color: #174ea6;
}

.incomeSummary {
  color: #008000;
}

.expenseSummary {
  color: #e60000;
}

.savingsSummary {
  color: #315ee8;
}

/* =========================================
   BUDGET SUMMARY
========================================= */

.budgetUtilised {
  color: #2563eb;
  font-weight: 600;
}

.budgetRemaining {
  color: #16a34a;
  font-weight: 600;
}

.budgetRemainingOver {
  color: #dc2626;
  font-weight: 600;
}

.budgetTotalRow {
  background: #f1f5f9;
  border-top: 2px solid #cbd5e1;
}

.budgetTotalRow td {
  font-weight: 700;
  padding-top: 14px;
  padding-bottom: 14px;
}

.budgetTotalRow .totalNumber {
  font-size: 20px;
  font-weight: 800;
}

.budgetTotalRow td:nth-child(3) {
  font-size: 20px;
  font-weight: 800;
}

/* =========================================
   DASHBOARD
========================================= */

.dashboardMonthSelector {
  display: flex;
  align-items: center;
  gap: 8px;
}

.dashboardMonthSelector label {
  font-size: 14px;
  color: #475569;
}

.dashboardMonthSelector select {
  padding: 8px 12px;
  border: 1px solid #cbd5e1;
  border-radius: 6px;
  background: white;
  font-size: 14px;
}


/* =========================================
   DASHBOARD CARD
========================================= */

.dashboardCard {
  background: white;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  padding: 20px;
  margin-bottom: 25px;
}

.dashboardCardHeader h2,
.dashboardSummaryHeader h2 {
  margin: 0;
  color: #123f82;
  font-size: 20px;
}


/* =========================================
   DAILY CHART
========================================= */

.dailyChart {
  height: 300px;
  display: flex;
  align-items: flex-end;
  gap: 5px;
  padding: 30px 10px 5px;
  border-bottom: 1px solid #cbd5e1;
  overflow-x: auto;
}

.chartBarWrapper {
  min-width: 28px;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
}

.chartBar {
  width: 20px;
  min-height: 2px;
  background: #2563eb;
  border-radius: 4px 4px 0 0;
}

.chartDay {
  margin-top: 7px;
  font-size: 11px;
  color: #64748b;
}

.chartAmount {
  font-size: 9px;
  color: #2563eb;
  min-height: 14px;
  white-space: nowrap;
  transform: rotate(-45deg);
}


/* =========================================
   MONTHLY SUMMARY
========================================= */

.dashboardSummarySection {
  background: white;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  padding: 20px;
}

.dashboardSummaryHeader {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.dashboardSummaryCards {
  display: grid;
  grid-template-columns:
    repeat(3, 1fr);
  gap: 15px;
}

.dashboardSummaryCard {
  border: 1px solid #dbe3ef;
  border-radius: 8px;
  padding: 20px;
  text-align: center;
  background: #f8fafc;
}

.dashboardSummaryTitle {
  font-size: 14px;
  color: #64748b;
  margin-bottom: 8px;
}

.dashboardSummaryValue {
  font-size: 24px;
  font-weight: 700;
}

@media (max-width: 700px) {

  .dashboardSummaryCards {
    grid-template-columns: 1fr;
  }

  .dashboardSummaryHeader {
    align-items: flex-start;
    gap: 15px;
    flex-direction: column;
  }

}

</style>
