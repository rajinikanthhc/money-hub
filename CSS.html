<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;

background:var(--background);

color:var(--text);

}

.app{

display:flex;

height:100vh;

overflow:hidden;

}

.main{

flex:1;

display:flex;

flex-direction:column;

overflow:auto;

}

.content{

padding:30px;

}

.header{

height:75px;

background:white;

display:flex;

align-items:center;

padding:0 28px;

border-bottom:1px solid var(--border);

font-size:30px;

font-weight:700;

}

.sidebar{

width:250px;

background:linear-gradient(180deg,#1e3a8a,#1e40af);

color:white;

padding:25px 20px;

}

.sidebar h2{

margin-bottom:35px;

font-size:18px;

}

.sidebar ul{

list-style:none;

}

.sidebar li{

padding:14px 16px;

margin-bottom:6px;

border-radius:10px;

cursor:pointer;

transition:.25s;

}

.sidebar li:hover{

background:rgba(255,255,255,.12);

}

.cards{

display:grid;

grid-template-columns:repeat(4,1fr);

gap:22px;

margin-top:20px;

}

.card{

background:white;

border-radius:var(--radius);

padding:28px;

box-shadow:var(--shadow);

transition:.25s;

}

.card:hover{

transform:translateY(-4px);

}

.card h3{

font-size:18px;

margin-bottom:18px;

font-weight:600;

color:var(--text-light);

}

.card h1{

font-size:42px;

font-weight:700;

}

.table{

width:100%;

border-collapse:collapse;

margin-top:20px;

}

.table th{

background:var(--primary);

color:white;

padding:14px;

text-align:left;

}

.table td{

padding:14px;

border-bottom:1px solid var(--border);

}

.table tr:hover{

background:#f8fafc;

}

@media(max-width:1200px){

.cards{

grid-template-columns:repeat(2,1fr);

}

}

@media(max-width:700px){

.sidebar{

display:none;

}

.cards{

grid-template-columns:1fr;

}

.content{

padding:15px;

}

}

.modal{

display:none;

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,.4);

justify-content:center;

align-items:center;

z-index:9999;

}

.modal-content{

background:white;

width:450px;

padding:25px;

border-radius:10px;

box-shadow:0 10px 30px rgba(0,0,0,.2);

}

.modal-content input,
.modal-content select{

width:100%;

padding:10px;

margin:8px 0 15px 0;

border:1px solid #ddd;

border-radius:5px;

font-size:15px;

}

.modal-content button{

padding:10px 18px;

margin-right:10px;

cursor:pointer;

border:none;

border-radius:5px;

background:#2563eb;

color:white;

}

.modal-content button:last-child{

background:#6b7280;

}

</style>
