<script>

function loadTransactions(){

    google.script.run
        .withSuccessHandler(showTransactions)
        .getAllTransactions();

}

function showTransactions(data){

    let html="";

    for(let i=1;i<data.length;i++){

        html+=`

        <tr>

        <td>${data[i][0]}</td>
        <td>${data[i][1]}</td>
        <td>${data[i][2]}</td>
        <td>${data[i][3]}</td>
        <td>${data[i][4]}</td>
        <td>₹${Number(data[i][5]).toLocaleString()}</td>
        <td>${data[i][6]}</td>
        <td>${data[i][7]}</td>

        <td>

        <button>Edit</button>

        <button>Delete</button>

        </td>

        </tr>

        `;

    }

    document.getElementById("transactionTable").innerHTML=html;

}

function openTransactionForm(){

    alert("Transaction Form - Coming Next");

}

</script>
