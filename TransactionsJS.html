<script>

let transactions = [];

function loadTransactions(){

    google.script.run
        .withSuccessHandler(function(data){

            transactions = data;
            showTransactions(data);

        })
        .getAllTransactions();

}

function showTransactions(data){

    let html="";

    for(let i=1;i<data.length;i++){

        html += `
        <tr>

            <td>${data[i][0]}</td>
            <td>${data[i][1]}</td>
            <td>${data[i][2]}</td>
            <td>${data[i][3]}</td>
            <td>${data[i][4]}</td>
<td>${data[i][5]}</td>
<td>₹${Number(data[i][6]).toLocaleString("en-IN")}</td>
<td>${data[i][7]}</td>
<td>${data[i][8]}</td>

            <td>

                <button onclick="editTransaction(${data[i][0]})">
                    ✏️
                </button>

                <button onclick="deleteTransaction(${data[i][0]})">
                    🗑️
                </button>

            </td>

        </tr>
        `;

    }

    document.getElementById("transactionTable").innerHTML = html;

}

function searchTransactions(){

    const keyword = document
        .getElementById("searchTransaction")
        .value
        .toLowerCase();

    let filtered = [];

    filtered.push(transactions[0]);

    for(let i=1;i<transactions.length;i++){

        if(transactions[i].join(" ").toLowerCase().includes(keyword)){

            filtered.push(transactions[i]);

        }

    }

    showTransactions(filtered);

}

let editRow = 0;

function openTransactionForm(){

    editRow = 0;

    clearTransactionForm();

    loadAccountDropdown();

    loadCategoryDropdown("Income");

    changeTransactionType();

    document.getElementById("transactionModal").style.display = "flex";

}

function closeTransactionForm(){

    document.getElementById("transactionModal").style.display = "none";

}

function saveTransaction(){

    const data = {

    date: document.getElementById("tDate").value,
    type: document.getElementById("tType").value,
    category: document.getElementById("tCategory").value,
    fromAccount: document.getElementById("tFromAccount").value,
    toAccount: document.getElementById("tToAccount").value,
    amount: document.getElementById("tAmount").value,
    payment: document.getElementById("tPayment").value,
    description: document.getElementById("tDescription").value

};

    const runner = google.script.run
    .withSuccessHandler(function(){

        editRow = 0;

        closeTransactionForm();
        clearTransactionForm();
        loadTransactions();
loadDashboard();
loadAccounts();

    })
    .withFailureHandler(function(err){
        console.log(err);
        alert(err.message);
    });

    if(editRow == 0){

        runner.saveTransaction(data);

    }else{

        data.id = editRow;

runner.updateTransaction(data);

    }

}

function clearTransactionForm(){

    document.getElementById("tDate").value = "";
    document.getElementById("tType").value = "Income";

    document.getElementById("tCategory").value = "";

    document.getElementById("tFromAccount").selectedIndex = 0;

if(document.getElementById("tToAccount").options.length>1){

    document.getElementById("tToAccount").selectedIndex=1;

}else{

    document.getElementById("tToAccount").selectedIndex=0;

}

    document.getElementById("tAmount").value = "";
    document.getElementById("tPayment").value = "Cash";
    document.getElementById("tDescription").value = "";

}

function loadCategoryDropdown(type, selectedCategory = "") {

    google.script.run
        .withSuccessHandler(function(list) {

            let html = "";

            list.forEach(function(category) {

                html += `<option value="${category}" ${
                    category === selectedCategory ? "selected" : ""
                }>${category}</option>`;

            });

            document.getElementById("tCategory").innerHTML = html;

        })
        .getCategoriesByType(type);

}

function formatDateForInput(date){

    const d = new Date(date);

    const y = d.getFullYear();

    const m = String(d.getMonth()+1).padStart(2,"0");

    const day = String(d.getDate()).padStart(2,"0");

    return `${y}-${m}-${day}`;

}

function editTransaction(id){

    const t = transactions.find(r => Number(r[0]) === Number(id));

    if(!t) return;

    editRow = id;

    // Transfer
if(t[2] == "Transfer"){

    editRow = id;

    loadTransferAccounts(t[4], t[5]);

    document.getElementById("trDate").value =
        formatDateForInput(t[1]);

    document.getElementById("trAmount").value = t[6];

    document.getElementById("trDescription").value = t[8];

    document.getElementById("transferModal").style.display = "flex";

    return;
}

    // Income / Expense

    document.getElementById("tDate").value =
        formatDateForInput(t[1]);

    document.getElementById("tType").value = t[2];

    changeTransactionType();

    loadAccountDropdown(t[4], t[5]);

    document.getElementById("tAmount").value = t[6];
    document.getElementById("tPayment").value = t[7];
    document.getElementById("tDescription").value = t[8];

    loadCategoryDropdown(t[2], t[3]);

    document.getElementById("transactionModal").style.display = "flex";

}

function deleteTransaction(id){

    if(!confirm("Are you sure you want to delete this transaction?")){
        return;
    }

    google.script.run
        .withSuccessHandler(function(){

            loadTransactions();
loadDashboard();
loadAccounts();

        })
        .deleteTransaction(id);

}

function loadAccountDropdown(fromSelected="", toSelected=""){

    google.script.run
        .withSuccessHandler(function(list){

            let fromHtml = "";
            let toHtml = "";

            list.forEach(function(account){

                fromHtml += `<option value="${account}" ${
                    account==fromSelected ? "selected" : ""
                }>${account}</option>`;

                toHtml += `<option value="${account}" ${
                    account==toSelected ? "selected" : ""
                }>${account}</option>`;

            });

            document.getElementById("tFromAccount").innerHTML = fromHtml;
            document.getElementById("tToAccount").innerHTML = toHtml;

        })
        .getAllAccountNames();

}

function changeTransactionType(){

    const type = document.getElementById("tType").value;

    if(type=="Expense"){

        document.getElementById("categoryDiv").style.display="block";
        document.getElementById("paymentDiv").style.display="block";

        document.getElementById("fromAccountDiv").style.display="block";
        document.getElementById("toAccountDiv").style.display="none";

        loadCategoryDropdown("Expense");

    }

    else if(type=="Income"){

    document.getElementById("categoryDiv").style.display="block";
    document.getElementById("paymentDiv").style.display="block";

    document.getElementById("fromAccountDiv").style.display="none";
    document.getElementById("toAccountDiv").style.display="block";

    loadCategoryDropdown("Income");

}

}   // <-- This closes changeTransactionType()

function openTransferForm(){

    editRow = 0;

    loadTransferAccounts();

    document.getElementById("trDate").value =
        new Date().toISOString().split("T")[0];

    document.getElementById("trAmount").value = "";
    document.getElementById("trDescription").value = "";

    document.getElementById("transferModal").style.display = "flex";

}

function closeTransferForm(){

    document.getElementById("transferModal").style.display = "none";

}

function loadTransferAccounts(fromSelected="", toSelected=""){

    google.script.run
        .withSuccessHandler(function(list){

            let fromHtml = "";
            let toHtml = "";

            list.forEach(function(account){

                fromHtml += `<option value="${account}" ${
                    account == fromSelected ? "selected" : ""
                }>${account}</option>`;

                toHtml += `<option value="${account}" ${
                    account == toSelected ? "selected" : ""
                }>${account}</option>`;

            });

            document.getElementById("trFromAccount").innerHTML = fromHtml;
            document.getElementById("trToAccount").innerHTML = toHtml;

            // Only for NEW transfer
            if(fromSelected == "" && toSelected == ""){

                document.getElementById("trFromAccount").selectedIndex = 0;

                if(list.length > 1){
                    document.getElementById("trToAccount").selectedIndex = 1;
                }

            }

        })
        .getAllAccountNames();

}

function saveTransfer(){

    if(document.getElementById("trFromAccount").value ==
       document.getElementById("trToAccount").value){

        alert("From Account and To Account cannot be the same.");
        return;

    }

    const runner = google.script.run
        .withSuccessHandler(function(){

            closeTransferForm();

            loadTransactions();
            loadDashboard();
            loadAccounts();

            editRow = 0;

        });

    const data = {

        date: document.getElementById("trDate").value,
        fromAccount: document.getElementById("trFromAccount").value,
        toAccount: document.getElementById("trToAccount").value,
        amount: document.getElementById("trAmount").value,
        description: document.getElementById("trDescription").value

    };

    if(editRow == 0){

        runner.saveTransfer(data);

    }else{

        data.id = editRow;

runner.updateTransfer(data);

    }

}

</script>
