<script>

function changePage(page,menu){

    document.querySelectorAll(".content > div")
        .forEach(div=>div.style.display="none");

    document.getElementById(page).style.display="block";

    document.querySelectorAll(".menu")
        .forEach(item=>item.classList.remove("active"));

    menu.classList.add("active");

    switch(page){

        case "dashboardPage":
            loadDashboard();
            break;

        case "transactionsPage":
            loadTransactions();
            break;

        case "categoriesPage":
    loadCategories();
    break;

        case "accountsPage":
    loadAccounts();
    break;

    case "budgetPage":
    loadMonthlyBudget();
    break;

        case "reportsPage":
            break;

        case "settingsPage":
            break;

    }

}

window.onload=function(){

    changePage("dashboardPage",
        document.querySelector(".menu.active"));

}

</script>
