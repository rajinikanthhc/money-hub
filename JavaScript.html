<script>

function loadPage(page){

    google.script.run
        .withSuccessHandler(function(html){

            document.getElementById("pageContent").innerHTML = html;

            initializePage(page);

        })
        .getPage(page);

}

function initializePage(page){

    switch(page){

        case "Dashboard":

            if(typeof initDashboard==="function")
                initDashboard();

            break;

        case "Transactions":

            if(typeof initTransactions==="function")
                initTransactions();

            break;

        case "Categories":

            if(typeof initCategories==="function")
                initCategories();

            break;

        case "Accounts":

            if(typeof initAccounts==="function")
                initAccounts();

            break;

        case "Reports":

            if(typeof initReports==="function")
                initReports();

            break;

        case "Settings":

            if(typeof initSettings==="function")
                initSettings();

            break;

    }

}

</script>
